[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://cafe-lush-production.up.railway.app/api/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "https://cafe-lush-production.up.railway.app/media/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
