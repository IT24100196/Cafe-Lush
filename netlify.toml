[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://api.shanthacafelush.com/api/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "https://api.shanthacafelush.com/media/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
